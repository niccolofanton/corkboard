name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The pinned pixi.js, and the newest 8.x the peer range allows: the texture uploads use Pixi internals
        # (src/render/textures.ts), so a new minor can break them.
        pixi: [pinned, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.pixi == 'latest'
        run: pnpm add -D pixi.js@^8
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
